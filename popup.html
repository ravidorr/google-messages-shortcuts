<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages Shortcut Actions</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <img src="icons/icon48.png" alt="" width="32" height="32" class="popup__icon">
        <div>
          <h1 class="popup__title">Messages Shortcut Actions</h1>
          <p class="popup__meta">
            <a
              id="guide-link"
              class="popup__guide-link"
              href="https://ravidorr.github.io/google-messages-shortcuts/"
              target="_blank"
              rel="noopener noreferrer"
            >Full shortcut guide</a>
          </p>
        </div>
      </header>

      <section class="popup__section" aria-labelledby="trash-confirmation-heading">
        <h2 id="trash-confirmation-heading" class="popup__section-title">Trash confirmation</h2>
        <label class="popup__checkbox-label">
          <input id="auto-confirm-trash" type="checkbox" checked disabled>
          Automatically confirm Move to trash
        </label>
      </section>

      <section class="popup__section" aria-labelledby="conversation-open-heading">
        <h2 id="conversation-open-heading" class="popup__section-title">Conversation opening</h2>
        <label class="popup__checkbox-label">
          <input id="open-conversation-on-focus" type="checkbox" disabled>
          Open conversations on hover or focus
        </label>
      </section>

      <section class="popup__section" aria-labelledby="pill-visibility-heading">
        <h2 id="pill-visibility-heading" class="popup__section-title">Pill visibility</h2>
        <label class="popup__select-label" for="pill-visibility">
          Show shortcut pills
        </label>
        <select id="pill-visibility" class="popup__select" disabled>
          <option value="hover-or-focus">On hover or focus</option>
          <option value="selected-row-only">On selected row only</option>
          <option value="hidden">Hidden</option>
        </select>
      </section>

      <section class="popup__section" aria-labelledby="extension-controls-heading">
        <h2 id="extension-controls-heading" class="popup__section-title">Extension controls</h2>
        <label class="popup__checkbox-label">
          <input id="pause-extension" type="checkbox" disabled>
          Pause shortcut actions and pills
        </label>
        <button
          id="reset-extension-preferences"
          type="button"
          class="popup__button popup__button--destructive"
          disabled
        >
          Reset extension preferences
        </button>
        <p id="reset-status" class="popup__status" role="status" aria-live="polite" hidden></p>
      </section>

      <footer class="popup__footer">
        <p id="extension-version" class="popup__version" hidden></p>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
